<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>콘솔 사칙연산 계산기</title>
    <script src="calculator.js"></script>
</head>
<body>
    <h1>콘솔창 계산기 프로그램</h1>
    <hr>
    <h3>Windows</h3>
    <p>1. F12 키를 눌러 개발자 도구의 콘솔 탭을 엽니다.</p>
    <p>2. <code>start()</code>를 입력하고 Enter를 눌러 계산기를 실행합니다.</p>
    <h3>Mac</h3>
    <p>1. Option + Command + I 키를 눌러 콘솔 탭을 엽니다.</p>
    <p>2. <code>start()</code>를 입력하고 Enter를 눌러 계산기를 실행합니다.</p>
    <hr>
    <p>예시 입력: <code>3 + 5 * 2</code>, <code>10 / 2 - 1</code></p>
    <p>계산이 끝나면 이어서 계산할지 물어보고, 취소를 누르면 종료됩니다.</p>
</body>
</html>
