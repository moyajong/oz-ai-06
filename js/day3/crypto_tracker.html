<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>암호화폐 가격 추적기</title>
    <link rel="stylesheet" href="crypto_style.css">
</head>
<body>
    <div class="container">
        <h1>실시간 암호화폐 가격 추적기</h1>

        <div class="tabs">
            <button id="allTab" class="tab-btn active" onclick="switchTab('all')">전체보기</button>
            <button id="favTab" class="tab-btn" onclick="switchTab('favorites')">관심목록</button>
        </div>

        <input type="text" id="searchBox" placeholder="심볼 검색 (예: BTCUSDT)">

        <p id="status">데이터를 불러오는 중...</p>

        <table id="cryptoTable" class="hidden">
            <thead>
                <tr>
                    <th>관심</th>
                    <th>심볼</th>
                    <th>현재가</th>
                    <th>24시간 변동률</th>
                    <th>고가</th>
                    <th>저가</th>
                </tr>
            </thead>
            <tbody id="cryptoBody"></tbody>
        </table>
    </div>

    <script src="crypto_tracker.js"></script>
</body>
</html>
